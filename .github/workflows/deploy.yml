name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Install deps
      run: |
        npm install -g mermaid.cli
    - name: Setup deploy options
      id: setup
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [[ ${GITHUB_REF} = refs/pull/*/merge ]]; then # pull request
          echo "SRC_BRANCH=${GITHUB_HEAD_REF}" >> $GITHUB_OUTPUT
          echo "NO_PUSH=--no-push" >> $GITHUB_OUTPUT
        elif [[ ${GITHUB_REF} = refs/heads/* ]]; then # branch, e.g. master, source etc
          echo "SRC_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        fi
        echo "DEPLOY_BRANCH=gh-pages" >> $GITHUB_OUTPUT
    - name: Deploy website
      run: |
        set -euo pipefail
        bundle exec jekyll build
        git config user.name "GitHub Action"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git fetch origin "${{ steps.setup.outputs.DEPLOY_BRANCH }}"
        git worktree add --detach /tmp/gh-pages "origin/${{ steps.setup.outputs.DEPLOY_BRANCH }}"
        find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
        cp -R _site/. /tmp/gh-pages/
        touch /tmp/gh-pages/.nojekyll
        git -C /tmp/gh-pages add -A
        git -C /tmp/gh-pages commit --allow-empty -m "${GITHUB_SHA} [ci skip]"
        git -C /tmp/gh-pages push origin "HEAD:${{ steps.setup.outputs.DEPLOY_BRANCH }}"
